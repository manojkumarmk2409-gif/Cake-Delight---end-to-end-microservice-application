apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: cake-delight
data:
  PORT: "3002"
  NODE_ENV: "production"
  CATALOG_SERVICE_URL: "http://catalog-service:3001"
  CART_SERVICE_URL: "http://cart-service:3006"
---
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secret
  namespace: cake-delight
type: Opaque
stringData:
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: cake_user
  MYSQL_PASSWORD: cake_pass
  MYSQL_DATABASE: order_db
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
