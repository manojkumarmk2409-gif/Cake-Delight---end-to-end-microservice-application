apiVersion: v1
kind: ConfigMap
metadata:
  name: cart-service-config
  namespace: cake-delight
data:
  PORT: "3006"
  NODE_ENV: "production"
  CATALOG_SERVICE_URL: "http://catalog-service:3001"
---
apiVersion: v1
kind: Secret
metadata:
  name: cart-service-secret
  namespace: cake-delight
type: Opaque
stringData:
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: cake_user
  MYSQL_PASSWORD: cake_pass
  MYSQL_DATABASE: cart_db
