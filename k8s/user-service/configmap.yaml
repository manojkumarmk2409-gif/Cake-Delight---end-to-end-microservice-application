apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: cake-delight
data:
  PORT: "3005"
  NODE_ENV: "production"
  OTP_TTL_MINUTES: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: user-service-secret
  namespace: cake-delight
type: Opaque
stringData:
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: cake_user
  MYSQL_PASSWORD: cake_pass
  MYSQL_DATABASE: user_db
  JWT_SECRET: supersecret
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: ""
  SMTP_PASS: ""
  SMTP_FROM: no-reply@cakedelight.com
