services:
  mysql:
    image: mysql:8.4
    container_name: cake-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cake-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s

  catalog-service:
    build: ./services/catalog-service
    container_name: cake-catalog
    restart: unless-stopped
    environment:
      PORT: 3001
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: cake_user
      MYSQL_PASSWORD: cake_pass
      MYSQL_DATABASE: catalog_db
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  order-service:
    build: ./services/order-service
    container_name: cake-order
    restart: unless-stopped
    environment:
      PORT: 3002
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: cake_user
      MYSQL_PASSWORD: cake_pass
      MYSQL_DATABASE: order_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      CATALOG_SERVICE_URL: http://catalog-service:3001
      CART_SERVICE_URL: http://cart-service:3006
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  rating-service:
    build: ./services/rating-service
    container_name: cake-rating
    restart: unless-stopped
    environment:
      PORT: 3003
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: cake_user
      MYSQL_PASSWORD: cake_pass
      MYSQL_DATABASE: rating_db
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  notification-service:
    build: ./services/notification-service
    container_name: cake-notification
    restart: unless-stopped
    environment:
      PORT: 3004
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: cake_user
      MYSQL_PASSWORD: cake_pass
      MYSQL_DATABASE: notification_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  user-service:
    build: ./services/user-service
    container_name: cake-user
    restart: unless-stopped
    environment:
      PORT: 3005
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: cake_user
      MYSQL_PASSWORD: cake_pass
      MYSQL_DATABASE: user_db
      NODE_ENV: production
      JWT_SECRET: supersecret
      OTP_TTL_MINUTES: 10
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 465
      SMTP_SECURE: "true"
      SMTP_USER: manojkumarmk.2409@gmail.com
      SMTP_PASS: kkxkdpofndhywdmn
      SMTP_FROM: manojkumarmk.2409@gmail.com
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  cart-service:
    build: ./services/cart-service
    container_name: cake-cart
    restart: unless-stopped
    environment:
      PORT: 3006
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: cake_user
      MYSQL_PASSWORD: cake_pass
      MYSQL_DATABASE: cart_db
      CATALOG_SERVICE_URL: http://catalog-service:3001
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  api-gateway:
    build: ./api-gateway
    container_name: cake-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173,http://localhost:80,http://127.0.0.1:5173,http://127.0.0.1:80
      CATALOG_SERVICE_URL: http://catalog-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      RATING_SERVICE_URL: http://rating-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      USER_SERVICE_URL: http://user-service:3005
      CART_SERVICE_URL: http://cart-service:3006
      NODE_ENV: production
      JWT_SECRET: supersecret
    depends_on:
      - catalog-service
      - order-service
      - rating-service
      - notification-service
      - user-service
      - cart-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: cake-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

volumes:
  mysql-data:
